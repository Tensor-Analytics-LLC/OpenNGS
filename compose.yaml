services:
  openngs:
    build: .
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - openngs-state:/state
      - openngs-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
volumes:
  openngs-state:
  openngs-data:
